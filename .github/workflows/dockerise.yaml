name: Docker Deploy

on:
  workflow_call:
    inputs:
      pkg_version:
        required: true
        type: string
      build_args:
        # Optional newline-separated KEY=VALUE pairs forwarded to `docker
        # build --build-arg`. Used in docker/build-push-action
        required: false
        type: string
        default: ""

jobs:
  docker_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release download
      packages: write

    steps:
      # Check out the release tag for exact provenance of the build context.
      - name: 🚚 Codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.pkg_version }}
          persist-credentials: false # no gitting after checkout
      # docker build installs from the conda lockfile, which condarise
      # generates after the tag is cut. The lockfiles are not committed, so
      # pull the fresh release assets condarise published into the repo root
      # (the build context) as the bare conda-<plat>.lock names the Dockerfile
      # COPYs.
      - name: ⬇️ Fetch lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for plat in linux-64 linux-aarch64; do
            gh release download "v${{ inputs.pkg_version }}" \
              --repo "${{ github.repository }}" \
              --pattern "*-v${{ inputs.pkg_version }}-conda-${plat}.lock" \
              --output "conda-${plat}.lock" --clobber
          done
      - name: 🏰 QEMU setup
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: 🐙 GitHub CR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Docker img build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ghcr.io/${{ github.repository }}:${{ inputs.pkg_version }}
          build-args: ${{ inputs.build_args }}
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
