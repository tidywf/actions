name: Docker Deploy

on:
  workflow_call:
    inputs:
      pkg_version:
        required: true
        type: string
      build_args:
        # newline-separated KEY=VALUE pairs forwarded to `docker
        # build --build-arg`. Used in docker/build-push-action
        required: false
        type: string
        default: ""
      labels:
        # newline-separated KEY=VALUE OCI labels, applied as image
        # labels and index/manifest annotations. Override the defaults that
        # docker/metadata-action derives from the GitHub repo (see README).
        required: false
        type: string
        default: ""

jobs:
  # One native runner per arch (no QEMU), each pushing its image by digest
  # only; docker_merge then stitches the digests into the tagged multi-arch
  # index. Emulated arm64 roughly doubled the conda env build time.
  #
  # No `type=gha` layer cache: tag-triggered runs can only restore caches
  # written by the same tag or the default branch, so a cache written by one
  # release is never readable by the next, and the conda layer rebuilds on
  # every release anyway (fresh lockfiles). Exporting it (mode=max, both
  # arches, multi-GB conda envs) cost ~8 min per run for zero hits.
  docker_build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    outputs:
      # identical across the matrix (same tag), so last-writer-wins is fine
      revision: ${{ steps.codeout.outputs.commit }}
    permissions:
      contents: read # release assets API
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # Check out the release tag for exact provenance of the build context.
      - name: 🚚 Codeout
        id: codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.pkg_version }}
          persist-credentials: false # no gitting after checkout
      # docker build installs from the conda lockfile, which condarise
      # generates after the tag is cut. The lockfiles are not committed, so
      # pull the fresh release assets condarise published into the repo root
      # (the build context) as the bare conda-<plat>.lock names the Dockerfile
      # COPYs.
      #
      # This deliberately avoids `gh release download`. That reads the
      # `assets` array embedded in the release object, which GitHub serves
      # from a cache that intermittently returns an empty list, so the step
      # failed with "no assets to download" while the assets were in fact
      # present. The per-release assets endpoint is consistent, so resolve the
      # release id (also consistent) and list the assets from there.
      - name: ⬇️ Fetch lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.pkg_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Retry as well: the assets endpoint has been consistent in testing,
          # but it is the same replicated store, so do not bet a release on it.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            ids=()
            missing=""
            # On 4xx/5xx `gh api` still prints the JSON error body to stdout
            # (even with --jq), so discard output on failure and sanity-check.
            rel_id=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null) || rel_id=""
            [[ "${rel_id}" =~ ^[0-9]+$ ]] || rel_id=""
            if [[ -n "${rel_id}" ]]; then
              assets=$(gh api "repos/${REPO}/releases/${rel_id}/assets?per_page=100" 2>/dev/null) || assets='[]'
              jq -e 'type == "array"' >/dev/null 2>&1 <<< "${assets}" || assets='[]'
              for plat in linux-64 linux-aarch64; do
                suffix="-${TAG}-conda-${plat}.lock"
                asset_id=$(jq -r --arg s "${suffix}" \
                  'map(select(.name | endswith($s))) | .[0].id // empty' <<< "${assets}")
                if [[ -z "${asset_id}" ]]; then
                  missing="${missing} ${suffix}"
                else
                  ids+=("${plat}:${asset_id}")
                fi
              done
            else
              missing=" (release ${TAG} not resolvable)"
            fi
            [[ -z "${missing}" ]] && break
            if [[ "${attempt}" -eq "${attempts}" ]]; then
              echo "Release ${TAG} still missing assets after ${attempts} attempts:${missing}" >&2
              echo "Assets currently visible:" >&2
              jq -r '.[].name' <<< "${assets:-[]}" >&2
              exit 1
            fi
            echo "Attempt ${attempt}: assets not visible yet (${missing# }); retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          for entry in "${ids[@]}"; do
            plat="${entry%%:*}"
            asset_id="${entry##*:}"
            gh api "repos/${REPO}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "conda-${plat}.lock"
            echo "conda-${plat}.lock: $(wc -c < "conda-${plat}.lock") bytes"
          done
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: 🐙 GitHub CR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lowercases the image name and generates OCI labels + manifest-level
      # annotations for this arch's image. Defaults come from the GitHub repo
      # (title, description, url, source, licenses); version and revision are
      # pinned to the tag here, then inputs.labels overrides any of them.
      # Labels set here override same-key Dockerfile LABELs. Tags and
      # index-level annotations are applied in docker_merge.
      - name: 🏷️ Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ inputs.pkg_version }}
            org.opencontainers.image.revision=${{ steps.codeout.outputs.commit }}
            ${{ inputs.labels }}
          annotations: |
            org.opencontainers.image.version=${{ inputs.pkg_version }}
            org.opencontainers.image.revision=${{ steps.codeout.outputs.commit }}
            ${{ inputs.labels }}
      - name: 📛 Image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "${GITHUB_OUTPUT}"
      - name: 🐳 Docker img build and push (by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ inputs.build_args }}
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: 🧾 Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: ⬆️ Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_merge:
    name: merge
    needs: [docker_build]
    runs-on: ubuntu-latest
    permissions:
      contents: read # metadata-action repo defaults
      packages: write

    steps:
      - name: ⬇️ Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🐙 GitHub CR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag + index-level annotations (what ghcr.io shows for multi-arch
      # images). Exposed to the next step as DOCKER_METADATA_OUTPUT_JSON.
      - name: 🏷️ Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=raw,value=${{ inputs.pkg_version }}
          annotations: |
            org.opencontainers.image.version=${{ inputs.pkg_version }}
            org.opencontainers.image.revision=${{ needs.docker_build.outputs.revision }}
            ${{ inputs.labels }}
      - name: 🐳 Docker manifest list create and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ${{ github.repository }}
          PKG_VERSION: ${{ inputs.pkg_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}"
          # Arrays, not word-splitting: annotation values contain spaces.
          args=()
          while IFS= read -r t; do args+=(-t "${t}"); done \
            < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          while IFS= read -r a; do args+=(--annotation "${a}"); done \
            < <(jq -r '.annotations[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          srcs=()
          for d in *; do srcs+=("${image}@sha256:${d}"); done
          [[ "${#srcs[@]}" -eq 2 ]] || { echo "Expected 2 digests, got ${#srcs[@]}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${srcs[@]}"
          docker buildx imagetools inspect "${image}:${PKG_VERSION}"
