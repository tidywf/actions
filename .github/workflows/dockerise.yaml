name: Docker Deploy

on:
  workflow_call:
    inputs:
      pkg_version:
        required: true
        type: string
      build_args:
        # Optional newline-separated KEY=VALUE pairs forwarded to `docker
        # build --build-arg`. Used in docker/build-push-action
        required: false
        type: string
        default: ""

jobs:
  docker_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release download
      packages: write

    steps:
      # Check out the release tag for exact provenance of the build context.
      - name: 🚚 Codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.pkg_version }}
          persist-credentials: false # no gitting after checkout
      # docker build installs from the conda lockfile, which condarise
      # generates after the tag is cut. The lockfiles are not committed, so
      # pull the fresh release assets condarise published into the repo root
      # (the build context) as the bare conda-<plat>.lock names the Dockerfile
      # COPYs.
      #
      # This deliberately avoids `gh release download`. That reads the
      # `assets` array embedded in the release object, which GitHub serves
      # from a cache that intermittently returns an empty list, so the step
      # failed with "no assets to download" while the assets were in fact
      # present. The per-release assets endpoint is consistent, so resolve the
      # release id (also consistent) and list the assets from there.
      - name: ⬇️ Fetch lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.pkg_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Retry as well: the assets endpoint has been consistent in testing,
          # but it is the same replicated store, so do not bet a release on it.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            ids=()
            missing=""
            rel_id=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
            if [[ -n "${rel_id}" ]]; then
              assets=$(gh api "repos/${REPO}/releases/${rel_id}/assets?per_page=100" 2>/dev/null || echo '[]')
              for plat in linux-64 linux-aarch64; do
                suffix="-${TAG}-conda-${plat}.lock"
                asset_id=$(jq -r --arg s "${suffix}" \
                  'map(select(.name | endswith($s))) | .[0].id // empty' <<< "${assets}")
                if [[ -z "${asset_id}" ]]; then
                  missing="${missing} ${suffix}"
                else
                  ids+=("${plat}:${asset_id}")
                fi
              done
            else
              missing=" (release ${TAG} not resolvable)"
            fi
            [[ -z "${missing}" ]] && break
            if [[ "${attempt}" -eq "${attempts}" ]]; then
              echo "Release ${TAG} still missing assets after ${attempts} attempts:${missing}" >&2
              echo "Assets currently visible:" >&2
              jq -r '.[].name' <<< "${assets:-[]}" >&2
              exit 1
            fi
            echo "Attempt ${attempt}: assets not visible yet (${missing# }); retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          for entry in "${ids[@]}"; do
            plat="${entry%%:*}"
            asset_id="${entry##*:}"
            gh api "repos/${REPO}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "conda-${plat}.lock"
            echo "conda-${plat}.lock: $(wc -c < "conda-${plat}.lock") bytes"
          done
      - name: 🏰 QEMU setup
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: 🐙 GitHub CR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Docker img build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          tags: ghcr.io/${{ github.repository }}:${{ inputs.pkg_version }}
          build-args: ${{ inputs.build_args }}
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
