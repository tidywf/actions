name: Docker Deploy

on:
  workflow_call:
    inputs:
      pkg_version:
        required: true
        type: string
      dir_conda_env_lock:
        required: false
        type: string
        default: deploy/conda/env/lock

jobs:
  docker_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    permissions:
      packages: write

    steps:
      # Check out the release tag for exact provenance of the build context.
      - name: 🚚 Codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.pkg_version }}
          persist-credentials: false # no git ops after checkout; avoids GITHUB_TOKEN leaking into build context
      # The docker build installs from the conda lockfile, which condarise
      # regenerates after the tag is cut, so the tag's copy is stale. Pull
      # the fresh lockfiles from the condarise job artifact, overwriting them.
      - name: ⬇️ Fetch lockfiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: conda-lockfiles
          path: ${{ inputs.dir_conda_env_lock }}
      - name: 🏰 QEMU setup
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: 🐙 GitHub CR login
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Docker img build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: ghcr.io/${{ github.repository }}:${{ inputs.pkg_version }}
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
