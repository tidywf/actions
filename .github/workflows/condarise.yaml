name: Conda Deploy

on:
  workflow_call:
    inputs:
      pkg_name:
        required: true
        type: string
      pkg_version:
        required: true
        type: string
      conda_org:
        required: false
        type: string
        default: tidywf
      dir_conda_recipe:
        required: false
        type: string
        default: deploy/conda/recipe
      dir_conda_env_yaml:
        required: false
        type: string
        default: deploy/conda/env/yaml

jobs:
  conda_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    permissions:
      contents: write
    env:
      INPUTS_CONDA_ORG: ${{ inputs.conda_org }}
      INPUTS_DIR_CONDA_RECIPE: ${{ inputs.dir_conda_recipe }}
      INPUTS_PKG_NAME: ${{ inputs.pkg_name }}
      INPUTS_DIR_CONDA_ENV_YAML: ${{ inputs.dir_conda_env_yaml }}
      INPUTS_PKG_VERSION: ${{ inputs.pkg_version }}

    steps:
      - name: 🚚 Codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.pkg_version }} # the bumped, tagged commit
          persist-credentials: false # no git ops; gh uses GH_TOKEN env
      - name: 🏷️ Set dev flags
        run: |
          # 4-part version (x.y.z.9XXX) => dev; 3-part (x.y.z) => main
          if [[ "${INPUTS_PKG_VERSION}" == *.*.*.* ]]; then
            echo "CONDA_DEV_CHANNEL=--channel ${INPUTS_CONDA_ORG}/label/dev" >> $GITHUB_ENV
            echo "ANACONDA_LABEL=--channel dev" >> $GITHUB_ENV
          fi
      - name: 👾 Miniforge setup
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          environment-file: ${{ inputs.dir_conda_env_yaml }}/condabuild.yaml
          activate-environment: condabuild_env
          miniforge-version: 26.1.0-0 # need to use mamba < 2.6.0 - see conda/conda-lock#906
      - name: 🐍 Conda pkg build
        run: |
          rattler-build build \
            ${CONDA_DEV_CHANNEL} \
            --channel ${INPUTS_CONDA_ORG} \
            --channel conda-forge \
            --recipe ${INPUTS_DIR_CONDA_RECIPE}/recipe.yaml \
            --output-dir ${RUNNER_TEMP}/out1
      - name: 🐍 Conda pkg upload
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          pkg_path=$(find ${RUNNER_TEMP}/out1 -type f -name "*.conda")
          rattler-build upload anaconda \
            --owner ${INPUTS_CONDA_ORG} \
            --api-key "${ANACONDA_API_KEY}" \
            ${ANACONDA_LABEL} \
            ${pkg_path}
      - name: 🔒 Conda lock
        run: |
          set -euo pipefail
          conda-lock lock \
            --file ${INPUTS_DIR_CONDA_ENV_YAML}/${INPUTS_PKG_NAME}.yaml \
            ${CONDA_DEV_CHANNEL} \
            --channel ${INPUTS_CONDA_ORG} \
            --channel conda-forge \
            -p linux-64 \
            -p linux-aarch64
          for plat in linux-64 linux-aarch64; do
            conda-lock render -p ${plat} conda-lock.yml \
              && mv conda-${plat}.lock "${RUNNER_TEMP}/"
          done
          rm conda-lock.yml
      - name: 📦 Publish lockfiles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Attach lockfiles to the vX.Y.Z release as assets.
          # bump.yaml cut a bare tag; create the GitHub Release
          # here if it doesn't exist. dockerise uses these assets.
          tag="v${INPUTS_PKG_VERSION}"
          assets=()
          for plat in linux-64 linux-aarch64; do
            dst="${RUNNER_TEMP}/${INPUTS_PKG_NAME}-${tag}-conda-${plat}.lock"
            cp "${RUNNER_TEMP}/conda-${plat}.lock" "${dst}"
            assets+=("${dst}")
          done
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" \
              --verify-tag \
              --title "${tag}" \
              --notes "Automated release for ${tag}." \
              "${assets[@]}"
          fi
