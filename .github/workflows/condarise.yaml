name: Conda Deploy

on:
  workflow_call:
    inputs:
      pkg_name:
        required: true
        type: string
      pkg_version:
        required: true
        type: string
      conda_org:
        required: false
        type: string
        default: tidywf
      dir_conda_recipe:
        required: false
        type: string
        default: deploy/conda/recipe
      dir_conda_env_yaml:
        required: false
        type: string
        default: deploy/conda/env/yaml
      dir_conda_env_lock:
        required: false
        type: string
        default: deploy/conda/env/lock

jobs:
  conda_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    permissions:
      contents: write
    env:
      INPUTS_CONDA_ORG: ${{ inputs.conda_org }}
      INPUTS_DIR_CONDA_RECIPE: ${{ inputs.dir_conda_recipe }}
      INPUTS_PKG_NAME: ${{ inputs.pkg_name }}
      INPUTS_DIR_CONDA_ENV_YAML: ${{ inputs.dir_conda_env_yaml }}
      INPUTS_DIR_CONDA_ENV_LOCK: ${{ inputs.dir_conda_env_lock }}
      INPUTS_PKG_VERSION: ${{ inputs.pkg_version }}

    steps:
      - name: 🚚 Codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏷️ Set dev flags
        run: |
          # 4-component version (x.y.z.9XXX) => dev release; 3-component => main
          if [[ "${INPUTS_PKG_VERSION}" == *.*.*.* ]]; then
            echo "CONDA_DEV_CHANNEL=--channel ${INPUTS_CONDA_ORG}/label/dev" >> $GITHUB_ENV
            echo "ANACONDA_LABEL=--channel dev" >> $GITHUB_ENV
          fi
      - name: 👾 Miniforge setup
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          environment-file: ${{ inputs.dir_conda_env_yaml }}/condabuild.yaml
          activate-environment: condabuild_env
          miniforge-version: 26.1.0-0 # need to use mamba < 2.6.0 - see conda/conda-lock#906
      - name: 🐍 Conda pkg build
        run: |
          rattler-build build \
            ${CONDA_DEV_CHANNEL} \
            --channel ${INPUTS_CONDA_ORG} \
            --channel conda-forge \
            --recipe ${INPUTS_DIR_CONDA_RECIPE}/recipe.yaml \
            --output-dir ${RUNNER_TEMP}/out1
      - name: 🐍 Conda pkg upload
        run: |
          pkg_path=$(find ${RUNNER_TEMP}/out1 -type f -name "*.conda")
          rattler-build upload anaconda \
            --owner ${INPUTS_CONDA_ORG} \
            --api-key ${{ secrets.ANACONDA_UPLOAD_TOKEN }} \
            ${ANACONDA_LABEL} \
            ${pkg_path}
      - name: 🔒 Conda lock
        run: |
          conda-lock lock \
            --file ${INPUTS_DIR_CONDA_ENV_YAML}/${INPUTS_PKG_NAME}.yaml \
            ${CONDA_DEV_CHANNEL} \
            --channel ${INPUTS_CONDA_ORG} \
            --channel conda-forge \
            -p linux-64 \
            -p linux-aarch64
          for plat in linux-64 linux-aarch64; do
            conda-lock render -p ${plat} conda-lock.yml \
              && mv conda-${plat}.lock ${INPUTS_DIR_CONDA_ENV_LOCK}/
          done
          rm conda-lock.yml
      - name: 📦 Publish lockfiles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach the freshly generated lockfiles to the vX.Y.Z release as
          # immutable, release-scoped assets. bump.yaml cut a bare tag; create
          # the GitHub Release here if it does not exist yet. dockerise pulls
          # these same assets for its build (tag's git tree is stale).
          assets=()
          for plat in linux-64 linux-aarch64; do
            dst="${RUNNER_TEMP}/${INPUTS_PKG_NAME}-v${INPUTS_PKG_VERSION}-conda-${plat}.lock"
            cp "${INPUTS_DIR_CONDA_ENV_LOCK}/conda-${plat}.lock" "${dst}"
            assets+=("${dst}")
          done
          if gh release view "v${INPUTS_PKG_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${INPUTS_PKG_VERSION}" "${assets[@]}" --clobber
          else
            gh release create "v${INPUTS_PKG_VERSION}" \
              --title "v${INPUTS_PKG_VERSION}" \
              --notes "Automated release for v${INPUTS_PKG_VERSION}." \
              "${assets[@]}"
          fi
